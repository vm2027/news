name: Fetch Daily News

on:
  schedule:
    # Fires hourly, :17 past the hour, from 14:00-20:00 UTC (~7-1pm PDT /
    # ~6am-12pm PST, depending on DST) instead of a single 7am shot.
    # GitHub's `schedule` trigger isn't reliable on its own -- runs get
    # delayed under load, and a missed slot is dropped rather than
    # retried -- so this retries across the morning. run_all.py's
    # already_fetched_today() makes every firing after the first a fast
    # no-op, so the retries are cheap. The :17 offset avoids the
    # top-of-hour, the most congested minute on GitHub's scheduler.
    - cron: '17 14-20 * * *'
  workflow_dispatch:         # Allow manual trigger from GitHub UI

# Hourly firings can overlap if one run is delayed or runs long (e.g. a
# slow feed). Without this, two concurrent runs could both fetch and then
# race to commit/push, corrupting the .last_fetch guard or conflicting on
# push. cancel-in-progress: false queues a new firing behind the current
# one instead of killing an in-flight fetch.
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # Needed to push the fetched articles back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # The default GITHUB_TOKEN pushes as github-actions[bot], which
          # the master ruleset doesn't allow to bypass "require PR" /
          # the "verify" required check (only Repository admin can). This
          # PAT is scoped to just this repo (Contents: Read and write) and
          # attributed to the repo owner, whose bypass already covers it.
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch all news topics
        run: python run_all.py
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          # Optional: Aiven Postgres connection string for the topic x
          # origin article log (see db.py). If the DATABASE_URL secret
          # isn't set, this is empty and db.py silently skips DB logging
          # -- the fetch and file output are unaffected either way.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # run_all.py now exits non-zero when Perplexity fails for a topic
      # that still fetched RSS successfully (see fetch_news.py),
      # specifically so RSS content still gets published on a
      # Perplexity-only failure. Without these steps still running after
      # that, the job would stop at the failed "Fetch all news topics"
      # step and never reach the commit -- RSS articles would be written
      # to the runner's disk and then simply discarded, achieving nothing.
      # !cancelled() (rather than the default success()) lets each step
      # still attempt to run after that earlier failure, but each is
      # explicitly gated on the *immediately preceding* step's own
      # outcome (steps.<id>.outcome) rather than the default success(),
      # which checks every step in the job -- so verify_index.py failing
      # for a real, unrelated reason still correctly blocks the commit,
      # exactly as before this change. The job's overall status still
      # reports failure (from the "Fetch all news topics" step), so none
      # of this hides the Perplexity-side problem.
      - name: Update index.html with latest articles
        if: ${{ !cancelled() }}
        id: build_index
        run: python build_index.py

      - name: Verify index.html reflects source data
        if: ${{ !cancelled() && steps.build_index.outcome == 'success' }}
        id: verify_index
        run: python verify_index.py

      - name: Commit and push new articles
        if: ${{ !cancelled() && steps.verify_index.outcome == 'success' }}
        run: |
          git config user.name "Vic"
          git config user.email "notebooklm14@gmail.com"
          git add obsidian/ index.html
          git diff --cached --quiet || git commit -m "Auto-update: daily news fetch $(date +'%Y-%m-%d')"
          git push
