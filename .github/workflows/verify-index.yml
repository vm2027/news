name: Verify Index

on:
  # No path filter: master's ruleset requires a status check named
  # "verify" (this job's name) on every PR before merging. A path
  # filter here means PRs that don't touch those files never trigger
  # this job, so the required check stays permanently pending and the
  # PR can never merge -- hit for real on a PR that only added an
  # unrelated workflow + script. Cheap enough to just always run.
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Rebuild index.html from source data
        run: python build_index.py

      - name: Verify index.html reflects source data
        run: python verify_index.py
